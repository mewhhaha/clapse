name: main

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  compiler-fixpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Fetch compiler artifact (LFS)
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="artifacts/latest/clap_compiler.wasm"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup just
        uses: extractions/setup-just@v1

      - name: Verify compiler fixpoint
        env:
          CLAP_COMPILER_WASM_PATH: artifacts/latest/clap_compiler.wasm
        run: just verify-compiler-fixpoint
